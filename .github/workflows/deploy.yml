name: Deploy Release (Docker)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - demo
          - alpha
          - beta
          - production
      tag:
        description: "Optional app release tag to deploy (empty => deploy `:latest`)"
        required: false
        type: string
      relay_tag:
        description: "Optional relay version to deploy as `splash-relay-${relay_tag}` (workflow_dispatch only)"
        required: false
        type: string
      build_app:
        description: "Rebuild app image (includes WASM from crates/splash-wasm)"
        required: false
        type: boolean
        default: false
      build_relay:
        description: "Build and push relay image (crates/splash-relay)"
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build Splash WASM image separately to keep its cache independent from the app image.
  build-and-push-wasm:
    name: Build and Push Splash WASM Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version tag for wasm tagging
        id: wasm_meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_IN="${{ github.event.inputs.tag }}"
            if [ -z "$TAG_IN" ]; then
              TAG="latest"
            else
              TAG="$TAG_IN"
            fi
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="latest"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push splash-wasm image (use cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deployment/splash-wasm/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:splash-wasm
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:splash-wasm-${{ steps.wasm_meta.outputs.tag }}
          cache-from: |
            type=gha,scope=pengui-wasm
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:splash-wasm
          cache-to: type=gha,mode=max,scope=pengui-wasm

  # Always build/push the computed relay tag.
  # Buildx will reuse cached layers when nothing changed.
  build-and-push-relay:
    name: Build and Push Splash Relay Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      relay_image: ${{ steps.set_relay_output.outputs.relay_image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute relay image/tag selection
        id: relay_meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            RELAY_BUILD_TAG="${{ github.ref_name }}"
          else
            APP_TAG="${{ github.event.inputs.tag }}"
            APP_TAG="${APP_TAG:-latest}"
            REQUESTED_RELAY_TAG="${{ github.event.inputs.relay_tag }}"
            RELAY_BUILD_TAG="${REQUESTED_RELAY_TAG:-$APP_TAG}"
          fi

          # For "latest", use the unversioned `:splash-relay` image.
          RELAY_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:splash-relay"
          if [ -n "${RELAY_BUILD_TAG:-}" ] && [ "$RELAY_BUILD_TAG" != "latest" ]; then
            RELAY_IMAGE="${RELAY_IMAGE}-${RELAY_BUILD_TAG}"
          fi

          echo "relay_image=$RELAY_IMAGE" >> "$GITHUB_OUTPUT"
          echo "relay_build_tag=$RELAY_BUILD_TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push splash-relay image (use cache)
        # Always build/push the computed relay tag so deployments never fail with "manifest unknown".
        # Buildx will reuse cached layers when nothing changed.
        if: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deployment/splash-relay/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:splash-relay
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:splash-relay-${{ steps.relay_meta.outputs.relay_build_tag }}
          cache-from: |
            type=gha,scope=pengui-relay
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:splash-relay
          cache-to: type=gha,mode=max,scope=pengui-relay

      - name: Set relay image output
        id: set_relay_output
        run: |
          echo "relay_image=${{ steps.relay_meta.outputs.relay_image }}" >> "$GITHUB_OUTPUT"

  # App image includes WASM (built from crates/splash-wasm in Dockerfile).
  # Always build/push the requested app tag; Buildx will reuse cached layers when nothing changed.
  build-and-push:
    name: Build and Push App Image (incl. WASM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    needs: [build-and-push-wasm]
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      full_image: ${{ steps.app_image_resolve.outputs.full_image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_IN="${{ github.event.inputs.tag }}"
            if [ -z "$TAG_IN" ]; then
              TAG="latest"
            else
              TAG="$TAG_IN"
            fi
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="latest"
          fi

          # Set environment: use input for workflow_dispatch, default to production for releases
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NEXT_PUBLIC_APP_ENV="${{ github.event.inputs.environment }}"
          else
            NEXT_PUBLIC_APP_ENV="production"
          fi

          # Short commit SHA for version display
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "full_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG" >> "$GITHUB_OUTPUT"
          echo "app_env=$NEXT_PUBLIC_APP_ENV" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Decide whether to build/push app image
        id: app_image_resolve
        run: |
          set -euo pipefail

          IMG_VERSIONED="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}"

          # This output is kept for backward compatibility with earlier workflow logic,
          # but the app build step is currently unconditional (cache-driven).
          if [ "${{ github.event_name }}" = "release" ]; then
            app_needs_build=true
          else
            app_needs_build="${{ github.event.inputs.build_app }}"
          fi

          echo "app_needs_build=$app_needs_build" >> "$GITHUB_OUTPUT"
          echo "full_image=$IMG_VERSIONED" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        # Always build/push the requested app tag.
        # Buildx will reuse cached layers when nothing changed.
        if: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deployment/Dockerfile
          push: true
          # Single, explicit tag so deployments are always reproducible
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: |
            type=gha,scope=pengui-app
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=gha,mode=max,scope=pengui-app
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ steps.meta.outputs.tag }}
            NEXT_PUBLIC_APP_ENV=${{ steps.meta.outputs.app_env }}
            NEXT_PUBLIC_COMMIT_SHA=${{ steps.meta.outputs.commit_sha }}
            # Use versioned WASM for deterministic app builds per requested tag.
            SPLASH_WASM_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag == 'latest' && 'splash-wasm' || format('splash-wasm-{0}', steps.meta.outputs.tag) }}
            NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID=${{ secrets.NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID }}
            NEXT_PUBLIC_WALLET_CONNECT_RELAY_URL=${{ vars.NEXT_PUBLIC_WALLET_CONNECT_RELAY_URL }}
            NEXT_PUBLIC_DEXIE_MAINNET_API_URL=${{ vars.NEXT_PUBLIC_DEXIE_MAINNET_API_URL }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_DEXIE_SPLASH_RELAY_MAINNET_WS_URL=wss://${{ vars.NEXT_PUBLIC_SPLASH_RELAY_MAINNET_SUBDOMAIN }}
            NEXT_PUBLIC_FEATURE_FLAGS=${{ vars.NEXT_PUBLIC_FEATURE_FLAGS }}

  deploy:
    name: Deploy to Production
    needs: [build-and-push, build-and-push-relay]
    if: always() && !cancelled() && needs.build-and-push.result == 'success' && needs.build-and-push-relay.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event.inputs.environment || 'production' }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Ensure deployment directory exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            mkdir -p ~/pengui/deployment
            echo "Deployment directory ready"

      - name: Copy deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          source: "deployment/*"
          target: "~/pengui/"
          overwrite: true

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.5
        env:
          DOCKER_IMAGE: ${{ needs.build-and-push.outputs.full_image }}
          SPLASH_RELAY_IMAGE: ${{ needs.build-and-push-relay.outputs.relay_image }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          DOMAIN: ${{ vars.DOMAIN }}
          EMAIL: ${{ vars.EMAIL }}
          STAGING: ${{ vars.STAGING }}
          RELAY_MAINNET_SUBDOMAIN: ${{ vars.NEXT_PUBLIC_SPLASH_RELAY_MAINNET_SUBDOMAIN }}
          PENGINE_SUBDOMAIN: ${{ vars.PENGINE_SUBDOMAIN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          timeout: 10m
          command_timeout: 5m
          envs: DOCKER_IMAGE,SPLASH_RELAY_IMAGE,GITHUB_TOKEN,GITHUB_ACTOR,DOMAIN,EMAIL,STAGING,RELAY_MAINNET_SUBDOMAIN,PENGINE_SUBDOMAIN
          script: |
            chmod +x ~/pengui/deployment/scripts/deploy.sh
            STAGING="${STAGING:-0}" RELAY_MAINNET_SUBDOMAIN="${RELAY_MAINNET_SUBDOMAIN:-}" ~/pengui/deployment/scripts/deploy.sh

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.2.5
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          envs: DOMAIN
          script: |
            echo "Checking deployment health..."
            sleep 5
            curl -sf --max-time 30 "https://$DOMAIN/api/health" && echo "Deployment verified!" || echo "Health check pending"
