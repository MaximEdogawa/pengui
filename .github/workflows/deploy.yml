name: Deploy Release (Docker)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - demo
          - alpha
          - beta
          - production
      tag:
        description: "Release tag to deploy (leave empty for latest)"
        required: false
        type: string
      build_relay:
        description: "Also build and push relay image (slower; omit for app-only deploy)"
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build relay only when relay code changed (release) or manual + "build relay" checked; otherwise reuse :splash-relay for fast app-only deploy
  build-and-push-relay:
    name: Build and Push Splash Relay Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      relay_image: ${{ steps.set_relay_output.outputs.relay_image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect relay changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.repository.default_branch || 'main' }}
          filters: |
            relay:
              - 'crates/splash-relay/**'
              - 'deployment/splash-relay/**'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag for relay
        id: relay_meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="latest"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push splash-relay image
        if: steps.filter.outputs.relay == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_relay == 'true')
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deployment/splash-relay/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:splash-relay
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:splash-relay-${{ steps.relay_meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set relay image output
        id: set_relay_output
        run: |
          if [ "${{ steps.filter.outputs.relay }}" = "true" ] || ([ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.build_relay }}" = "true" ]); then
            echo "relay_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:splash-relay-${{ steps.relay_meta.outputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "relay_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:splash-relay" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      full_image: ${{ steps.meta.outputs.full_image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="latest"
          fi

          # Set environment: use input for workflow_dispatch, default to production for releases
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NEXT_PUBLIC_APP_ENV="${{ github.event.inputs.environment }}"
          else
            NEXT_PUBLIC_APP_ENV="production"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "full_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG" >> "$GITHUB_OUTPUT"
          echo "app_env=$NEXT_PUBLIC_APP_ENV" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deployment/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ steps.meta.outputs.tag }}
            NEXT_PUBLIC_APP_ENV=${{ steps.meta.outputs.app_env }}
            NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID=${{ secrets.NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID }}
            NEXT_PUBLIC_WALLET_CONNECT_RELAY_URL=${{ vars.NEXT_PUBLIC_WALLET_CONNECT_RELAY_URL }}
            NEXT_PUBLIC_DEXIE_MAINNET_API_URL=${{ vars.NEXT_PUBLIC_DEXIE_MAINNET_API_URL }}
            NEXT_PUBLIC_DEXIE_TESTNET_API_URL=${{ vars.NEXT_PUBLIC_DEXIE_TESTNET_API_URL }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_DEXIE_SPLASH_RELAY_MAINNET_WS_URL=wss://${{ vars.NEXT_PUBLIC_SPLASH_RELAY_MAINNET_SUBDOMAIN }}
            NEXT_PUBLIC_DEXIE_SPLASH_RELAY_TESTNET_WS_URL=wss://${{ vars.NEXT_PUBLIC_SPLASH_RELAY_TESTNET_SUBDOMAIN }}

  deploy:
    name: Deploy to Production
    needs: [build-and-push, build-and-push-relay]
    if: always() && !cancelled() && needs.build-and-push.result == 'success' && needs.build-and-push-relay.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure deployment directory exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            mkdir -p ~/pengui/deployment
            echo "Deployment directory ready"

      - name: Copy deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          source: "deployment/*"
          target: "~/pengui/"
          overwrite: true

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.5
        env:
          DOCKER_IMAGE: ${{ needs.build-and-push.outputs.full_image }}
          # :splash-relay when relay wasn't built this run; :splash-relay-TAG when it was
          SPLASH_RELAY_IMAGE: ${{ needs.build-and-push-relay.outputs.relay_image }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          DOMAIN: ${{ vars.DOMAIN }}
          EMAIL: ${{ vars.EMAIL }}
          STAGING: ${{ vars.STAGING }}
          RELAY_MAINNET_SUBDOMAIN: ${{ vars.NEXT_PUBLIC_SPLASH_RELAY_MAINNET_SUBDOMAIN }}
          RELAY_TESTNET_SUBDOMAIN: ${{ vars.NEXT_PUBLIC_SPLASH_RELAY_TESTNET_SUBDOMAIN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          timeout: 10m
          command_timeout: 5m
          envs: DOCKER_IMAGE,SPLASH_RELAY_IMAGE,GITHUB_TOKEN,GITHUB_ACTOR,DOMAIN,EMAIL,STAGING,RELAY_MAINNET_SUBDOMAIN,RELAY_TESTNET_SUBDOMAIN
          script: |
            export DOCKER_IMAGE="$DOCKER_IMAGE"
            export SPLASH_RELAY_IMAGE="$SPLASH_RELAY_IMAGE"
            export GITHUB_TOKEN="$GITHUB_TOKEN"
            export GITHUB_ACTOR="$GITHUB_ACTOR"
            export DOMAIN="$DOMAIN"
            export EMAIL="$EMAIL"
            export STAGING="${STAGING:-0}"
            export RELAY_MAINNET_SUBDOMAIN="${RELAY_MAINNET_SUBDOMAIN:-}"
            export RELAY_TESTNET_SUBDOMAIN="${RELAY_TESTNET_SUBDOMAIN:-}"
            chmod +x ~/pengui/deployment/scripts/deploy.sh
            ~/pengui/deployment/scripts/deploy.sh

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.2.5
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          envs: DOMAIN
          script: |
            echo "Checking deployment health..."
            sleep 5
            curl -sf --max-time 30 "https://$DOMAIN/api/health" && echo "Deployment verified!" || echo "Health check pending"
