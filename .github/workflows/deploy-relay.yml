name: Deploy Relay (Docker)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      relay_tag:
        description: "Optional relay version tag to deploy as `splash-relay-${relay_tag}` (empty => `:splash-relay` / latest)"
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # A release fires this workflow AND build-app.yml every time, even when
  # only app code changed. Skip the relay build/deploy entirely in that case
  # so shipping an app-only release stays fast and doesn't bounce the relay
  # containers for no reason. Manual workflow_dispatch always runs - that's
  # an explicit "redeploy the relay" request.
  detect-changes:
    name: Detect Relay Changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check for relay changes since previous release
        id: check
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "release" ]; then
            echo "Manual dispatch - always running." >&2
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREV_TAG="$(git tag --sort=-creatordate | grep -vx "${{ github.ref_name }}" | head -n1 || true)"
          if [ -z "$PREV_TAG" ]; then
            echo "No previous release tag found - treating as changed." >&2
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$PREV_TAG"..HEAD -- crates/splash-relay deployment/splash-relay; then
            echo "No relay-related changes since $PREV_TAG - skipping relay build/deploy." >&2
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Relay-related changes since $PREV_TAG." >&2
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Always build/push the computed relay tag.
  # Buildx will reuse cached layers when nothing changed.
  build-and-push-relay:
    name: Build and Push Splash Relay Image
    needs: [detect-changes]
    if: needs.detect-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      relay_image: ${{ steps.set_relay_output.outputs.relay_image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute relay image/tag selection
        id: relay_meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            RELAY_BUILD_TAG="${{ github.ref_name }}"
          else
            RELAY_BUILD_TAG="${{ github.event.inputs.relay_tag }}"
          fi

          # For "latest"/unset, use the unversioned `:splash-relay` image.
          RELAY_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:splash-relay"
          if [ -n "${RELAY_BUILD_TAG:-}" ] && [ "$RELAY_BUILD_TAG" != "latest" ]; then
            RELAY_IMAGE="${RELAY_IMAGE}-${RELAY_BUILD_TAG}"
          fi

          echo "relay_image=$RELAY_IMAGE" >> "$GITHUB_OUTPUT"
          echo "relay_build_tag=$RELAY_BUILD_TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push splash-relay image (use cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deployment/splash-relay/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:splash-relay
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:splash-relay-${{ steps.relay_meta.outputs.relay_build_tag }}
          cache-from: |
            type=gha,scope=pengui-relay
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:splash-relay
          cache-to: type=gha,mode=max,scope=pengui-relay

      - name: Set relay image output
        id: set_relay_output
        run: |
          echo "relay_image=${{ steps.relay_meta.outputs.relay_image }}" >> "$GITHUB_OUTPUT"

  # ONCE (https://github.com/basecamp/once) owns TLS/reverse-proxy for the
  # WebSocket side; the raw P2P TCP side runs as plain docker containers
  # outside ONCE (see deployment/README.md for why). Nothing here touches
  # the app - it deploys independently via build-app.yml.
  deploy:
    name: Deploy Relay to Production
    needs: [detect-changes, build-and-push-relay]
    if: needs.detect-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy relay via ONCE + P2P side-channels
        uses: appleboy/ssh-action@v1.2.5
        env:
          RELAY_IMAGE: ${{ needs.build-and-push-relay.outputs.relay_image }}
          DOMAIN: ${{ vars.DOMAIN }}
          RELAY_MAINNET_SUBDOMAIN: ${{ vars.NEXT_PUBLIC_SPLASH_RELAY_MAINNET_SUBDOMAIN }}
          RELAY_TESTNET_SUBDOMAIN: ${{ vars.NEXT_PUBLIC_SPLASH_RELAY_TESTNET_SUBDOMAIN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          timeout: 10m
          command_timeout: 8m
          envs: RELAY_IMAGE,DOMAIN,RELAY_MAINNET_SUBDOMAIN,RELAY_TESTNET_SUBDOMAIN
          script: |
            set -euo pipefail
            RELAY_MAINNET_SUBDOMAIN="${RELAY_MAINNET_SUBDOMAIN:-relay.$DOMAIN}"
            RELAY_TESTNET_SUBDOMAIN="${RELAY_TESTNET_SUBDOMAIN:-relay-testnet.$DOMAIN}"

            echo "==> Relay (mainnet): $RELAY_IMAGE -> wss://$RELAY_MAINNET_SUBDOMAIN"
            once deploy "$RELAY_IMAGE" --host "$RELAY_MAINNET_SUBDOMAIN"

            echo "==> Relay (testnet): $RELAY_IMAGE -> wss://$RELAY_TESTNET_SUBDOMAIN"
            # First run only: set RELAY_TESTNET=1 on this app via the ONCE
            # dashboard/CLI so it joins splash-testnet instead of mainnet.
            once deploy "$RELAY_IMAGE" --host "$RELAY_TESTNET_SUBDOMAIN"

            echo "==> Relay P2P peering side-channels (raw TCP, outside ONCE)"
            docker pull "$RELAY_IMAGE"
            docker rm -f pengui-relay-p2p-mainnet >/dev/null 2>&1 || true
            docker run -d --name pengui-relay-p2p-mainnet --restart unless-stopped \
              -p 11511:11511 "$RELAY_IMAGE"
            docker rm -f pengui-relay-p2p-testnet >/dev/null 2>&1 || true
            docker run -d --name pengui-relay-p2p-testnet --restart unless-stopped \
              -p 11512:11511 -e RELAY_TESTNET=1 "$RELAY_IMAGE"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.2.5
        env:
          RELAY_MAINNET_SUBDOMAIN: ${{ vars.NEXT_PUBLIC_SPLASH_RELAY_MAINNET_SUBDOMAIN }}
          DOMAIN: ${{ vars.DOMAIN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: RELAY_MAINNET_SUBDOMAIN,DOMAIN
          script: |
            RELAY_MAINNET_SUBDOMAIN="${RELAY_MAINNET_SUBDOMAIN:-relay.$DOMAIN}"
            echo "Checking relay health..."
            sleep 5
            curl -sf --max-time 30 "https://$RELAY_MAINNET_SUBDOMAIN/up" && echo "Deployment verified!" || echo "Health check pending (ONCE may still be provisioning TLS)"
