name: Build App (Docker)

# Builds and pushes the app image to ghcr.io - that's it. ONCE
# (https://github.com/basecamp/once) fetches and deploys the latest image on
# its own once the app is registered with it (see deployment/README.md for
# the one-time `once deploy` step). The relay has its own separate pipeline:
# .github/workflows/build-relay.yml.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: "Build environment (controls the in-app info banner)"
        required: true
        type: choice
        options:
          - demo
          - alpha
          - beta
          - production
        default: production
      tag:
        description: "Optional app release tag to build (empty => build `:latest`)"
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build Splash WASM image separately to keep its cache independent from the app image.
  build-and-push-wasm:
    name: Build and Push Splash WASM Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version tag for wasm tagging
        id: wasm_meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_IN="${{ github.event.inputs.tag }}"
            TAG="${TAG_IN:-latest}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="latest"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push splash-wasm image (use cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deployment/splash-wasm/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:splash-wasm
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:splash-wasm-${{ steps.wasm_meta.outputs.tag }}
          cache-from: |
            type=gha,scope=pengui-wasm
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:splash-wasm
          cache-to: type=gha,mode=max,scope=pengui-wasm

  # App image includes WASM (built from crates/splash-wasm in Dockerfile).
  build-and-push:
    name: Build and Push App Image (incl. WASM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    needs: [build-and-push-wasm]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_IN="${{ github.event.inputs.tag }}"
            TAG="${TAG_IN:-latest}"
            NEXT_PUBLIC_APP_ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.ref_name }}"
            NEXT_PUBLIC_APP_ENV="production"
          else
            TAG="latest"
            NEXT_PUBLIC_APP_ENV="production"
          fi

          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "app_env=$NEXT_PUBLIC_APP_ENV" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deployment/Dockerfile
          push: true
          # Single, explicit tag so deployments are always reproducible
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: |
            type=gha,scope=pengui-app
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=gha,mode=max,scope=pengui-app
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ steps.meta.outputs.tag }}
            NEXT_PUBLIC_APP_ENV=${{ steps.meta.outputs.app_env }}
            NEXT_PUBLIC_COMMIT_SHA=${{ steps.meta.outputs.commit_sha }}
            # Use versioned WASM for deterministic app builds per requested tag.
            SPLASH_WASM_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag == 'latest' && 'splash-wasm' || format('splash-wasm-{0}', steps.meta.outputs.tag) }}
            NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID=${{ secrets.NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID }}
            NEXT_PUBLIC_WALLET_CONNECT_RELAY_URL=${{ vars.NEXT_PUBLIC_WALLET_CONNECT_RELAY_URL }}
            NEXT_PUBLIC_DEXIE_MAINNET_API_URL=${{ vars.NEXT_PUBLIC_DEXIE_MAINNET_API_URL }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_DEXIE_SPLASH_RELAY_MAINNET_WS_URL=wss://${{ vars.NEXT_PUBLIC_SPLASH_RELAY_MAINNET_SUBDOMAIN }}
            NEXT_PUBLIC_DEXIE_SPLASH_RELAY_TESTNET_WS_URL=wss://${{ vars.NEXT_PUBLIC_SPLASH_RELAY_TESTNET_SUBDOMAIN }}
            NEXT_PUBLIC_FEATURE_FLAGS=${{ vars.NEXT_PUBLIC_FEATURE_FLAGS }}
