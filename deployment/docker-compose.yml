version: "3.8"

services:
  nginx:
    image: nginx:alpine
    container_name: pengui-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    volumes_from:
      - pengui-data:ro
    depends_on:
      - pengui-data
    networks:
      - pengui-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  pengui-data:
    image: ${DOCKER_IMAGE:-ghcr.io/maximedogawa/pengui:latest}
    container_name: pengui-data
    command: ["/bin/sh", "-c", "exit 0"]
    restart: "no"

  certbot:
    image: certbot/certbot:latest
    container_name: pengui-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - pengui-network

networks:
  pengui-network:
    driver: bridge
