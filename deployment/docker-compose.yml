version: "3.8"
services:
  pengui-data:
    image: ${DOCKER_IMAGE:-ghcr.io/maximedogawa/pengui:latest}
    container_name: pengui-data
    # This container doesn't run, it's just for data
    entrypoint: ["true"]
    restart: "no"

  nginx:
    image: nginx:alpine
    container_name: pengui-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      # Copy files from pengui-data image
      - pengui-dist:/usr/share/nginx/html:ro
    depends_on:
      - pengui-data
    networks:
      - pengui-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:80",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  certbot:
    image: certbot/certbot
    container_name: pengui-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - pengui-network

volumes:
  pengui-dist:
    external: false

networks:
  pengui-network:
    driver: bridge
