services:
  # Next.js application server
  pengui:
    image: ${DOCKER_IMAGE:-ghcr.io/maximedogawa/pengui:latest}
    container_name: pengui-app
    hostname: pengui
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      pengui-network:
        aliases:
          - pengui
          - app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx reverse proxy with SSL termination (exits when splash-relay stops listening)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: pengui-nginx-relay-coupled:latest
    container_name: pengui-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    environment:
      - RELAY_WATCHDOG=${RELAY_WATCHDOG:-1}
    depends_on:
      pengui:
        condition: service_healthy
    networks:
      - pengui-network
    # Add DNS configuration for reliable resolution
    dns:
      - 127.0.0.11
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null --tries=1 --timeout=3 http://127.0.0.1/health && nc -z -w 3 splash-relay 9090",
        ]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Certbot for SSL certificate management (on-demand only)
  certbot:
    image: certbot/certbot:latest
    container_name: pengui-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - pengui-network
    profiles:
      - certbot

  # Splash relay (mainnet) – libp2p bridge to Splash network; browsers connect via WebSocket
  splash-relay:
    image: ${SPLASH_RELAY_IMAGE:-ghcr.io/maximedogawa/pengui:splash-relay}
    container_name: pengui-splash-relay
    hostname: splash-relay
    restart: unless-stopped
    ports:
      - "9090:9090" # WebSocket for app/browser connections
      - "11511:11511" # TCP for Splash network (optional)
    command: ["--tcp-port", "11511", "--ws-port", "9090"]
    networks:
      pengui-network:
        aliases:
          - splash-relay
    # Minimal log retention: one 5MB file so "docker compose logs" works; new container = new file after reboot
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 2 127.0.0.1 9090 && nc -z -w 2 127.0.0.1 11511"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"

networks:
  pengui-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
