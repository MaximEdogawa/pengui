[package]
name = "splash-relay"
version = "0.1.0"
edition = "2021"
description = "libp2p relay for Splash network - connects browsers to Splash via WebSocket"
license = "MIT"

[[bin]]
name = "splash-relay"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
libp2p = { version = "0.55", features = [
    "tokio",
    "tcp",
    "websocket",
    "tls",
    "dns",
    "noise",
    "yamux",
    "gossipsub",
    "kad",
    "identify",
    "macros",
    "ed25519",
    "secp256k1"
] }
futures = "0.3"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.4", features = ["derive", "env"] }
hickory-resolver = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1"
